[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
  adafruit/Adafruit ADS1X15
lib_ldf_mode = deep+
build_flags =
  -DCORE_DEBUG_LEVEL=1
