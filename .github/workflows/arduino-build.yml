name: Build NodeMCU firmware & tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate dashboard & compile NodeMCU firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate dashboard JavaScript & tests
        run: |
          npm run check
          npm test

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile NodeMCU ESP8266 Wi-Fi firmware
        run: pio run -d firmware/SpineAlign_NodeMCU
